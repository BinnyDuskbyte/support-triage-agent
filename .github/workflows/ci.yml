# Light CI for a solo learning build — reinforces the production habit that makes you hireable.
# Runs lint + unit tests on every push/PR.
name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && black --check .
      - name: Unit tests
        run: pytest -m "not integration and not eval"
      